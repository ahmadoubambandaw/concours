# Scolaris — pile complète : PostgreSQL + API + Web
#
#   docker compose up -d
#   docker compose exec api npm run seed   # données de démonstration
#
# Web : http://localhost:3000 — API : http://localhost:4000

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scolaris
      POSTGRES_PASSWORD: scolaris
      POSTGRES_DB: scolaris
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U scolaris']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://scolaris:scolaris@postgres:5432/scolaris
      PORT: 4000
      NODE_ENV: production
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-changez-moi-access}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-changez-moi-refresh}
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '4000:4000'

  web:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://api:4000
    depends_on:
      - api
    ports:
      - '3000:3000'

volumes:
  pgdata:
